# satty - screenshot annotator (flameshot replacement on Wayland)
[general]
fullscreen = false
early-exit = true
corner-roundness = 8
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
output-filename = "~/Pictures/SS/%Y-%m-%d_%H-%M-%S.png"
save-after-copy = false
default-hide-toolbars = false
primary-highlighter = "block"
disable-notifications = false
no-window-decoration = true
brush-smooth-history-size = 10
# Enter = copy + exit, Ctrl+S = save, Esc = quit
actions-on-enter = ["save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
actions-on-right-click = ["save-to-clipboard", "exit"]

[font]
family = "GeistMono Nerd Font"
style = "Medium"

[color-palette]
palette = ["#d08a8a", "#d8b98a", "#a9c2d6", "#9fc9a5", "#c9ccd4", "#101117"]
