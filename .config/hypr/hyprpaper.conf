# hyprpaper 0.8+ block syntax (preload/old one-liners are gone)

# Acer (middle, main) - SUPER+Space cycles ~/Pictures/wallpaper/main
wallpaper {
    monitor = HDMI-A-1
    path = ~/Pictures/wallpaper/main/dusk-clouds.jpg
    fit_mode = cover
}

# Xiaomi (right, vertical)
wallpaper {
    monitor = DP-2
    path = ~/Pictures/wallpaper/vertical.jpg
    fit_mode = cover
}

# Laptop built-in
wallpaper {
    monitor = eDP-1
    path = ~/Pictures/wallpaper/moon.png
    fit_mode = cover
}

splash = false
