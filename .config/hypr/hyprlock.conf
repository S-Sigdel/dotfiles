background {
    monitor =
    path = ~/Pictures/wallpaper/main.png
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 300 50
    outline_thickness = 2
    outer_color = rgb(33ccff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    placeholder_text = <i>Password...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}
