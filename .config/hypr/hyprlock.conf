# hyprlock — retro pixel. Launched via scripts/lock.sh, which renders the
# pixelated + scanlined snapshot below. In values, '#' must be written '##'.

$fg     = rgb(c9ccd4)
$dim    = rgb(6e7585)
$accent = rgb(a9c2d6)
$shadow = rgb(0b0c10)
$pixel  = Minecraft
$hud    = BigBlueTermPlus Nerd Font Mono

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled   = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn,           1, 3, linear
    animation = fadeOut,          1, 3, linear
    animation = inputFieldDots,   1, 1, linear
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldWidth,  1, 2, linear
}

background {
    monitor     =
    path        = ~/.cache/hyprlock-bg.png
    color       = rgb(101117)
    blur_passes = 0
}

# clock: hard offset shadow (no blur) under the real thing, like an old game title
label {
    monitor     =
    text        = $TIME
    color       = $shadow
    font_size   = 150
    font_family = $pixel
    position    = 8, 132
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = $TIME
    color       = $fg
    font_size   = 150
    font_family = $pixel
    position    = 0, 140
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] echo "▸ $(date +'%a %d %b' | tr '[:lower:]' '[:upper:]') ◂"
    color       = $accent
    font_size   = 16
    font_family = $hud
    position    = 0, 10
    halign      = center
    valign      = center
}

# player tag
label {
    monitor     =
    text        = PLAYER 1  ·  $USER
    color       = $dim
    font_size   = 11
    font_family = $hud
    position    = 0, -48
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 300, 44
    outline_thickness = 2
    rounding          = 0
    inner_color       = rgba(101117cc)
    outer_color       = rgba(6e7585ff)
    check_color       = rgba(a9c2d6ff)
    fail_color        = rgba(d08a8aff)
    capslock_color    = rgba(d8b98aff)
    font_color        = $fg
    font_family       = $hud

    dots_size     = 0.3
    dots_spacing  = 0.35
    dots_rounding = 0
    dots_center   = true
    fade_on_empty = false

    placeholder_text = <span foreground="##6e7585">&gt; PRESS START_</span>
    check_text       = <span foreground="##a9c2d6">LOADING...</span>
    fail_text        = <span foreground="##d08a8a">GAME OVER</span> <span foreground="##6e7585">x$ATTEMPTS</span>
    fail_timeout     = 2000

    position = 0, -100
    halign   = center
    valign   = center
}

# battery
label {
    monitor     =
    text        = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    color       = $dim
    font_size   = 12
    font_family = $hud
    position    = 36, 30
    halign      = left
    valign      = bottom
}

# now playing
label {
    monitor     =
    text        = cmd[update:2000] ~/.config/hypr/scripts/lock-info.sh media
    color       = $dim
    font_size   = 12
    font_family = $hud
    position    = -36, 30
    halign      = right
    valign      = bottom
}
