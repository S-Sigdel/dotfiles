# cava for the desktop visualizer (kitty background panel, see hypr/scripts/visualizer.sh)
[general]
framerate = 45
autosens = 1
bar_width = 2
bar_spacing = 1
# 0 = never sleep: waking from sleep made the bars start late
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = noncurses
orientation = bottom
channels = stereo
mono_option = average

[color]
background = default
# dim slate at the base -> steel blue tips (matches waybar/rofi/swaync)
gradient = 1
gradient_color_1 = '#2a2f3a'
gradient_color_2 = '#3f4a5a'
gradient_color_3 = '#6f8499'
gradient_color_4 = '#a9c2d6'

[smoothing]
monstercat = 1
noise_reduction = 25
