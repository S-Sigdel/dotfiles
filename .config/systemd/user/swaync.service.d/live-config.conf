# Always run swaync on the generated config that carries the current notification
# mode (see ~/.config/hypr/scripts/notif-mode.sh), however it gets started.
[Service]
ExecStartPre=%h/.config/hypr/scripts/notif-mode.sh sync
ExecStart=
ExecStart=/usr/bin/swaync -c %h/.cache/swaync/config.json
# restore DND to match the saved mode once swaync owns the bus
ExecStartPost=%h/.config/hypr/scripts/notif-mode.sh apply
